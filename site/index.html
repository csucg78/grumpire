<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRUMPIRE — MiLB Umpire &amp; ABS Audit</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <h1>GRUMPIRE</h1>
      <p class="subtitle">MiLB Home Plate Umpire Accuracy &amp; Unmasked ABS Challenge Tracker (AAA + FSL)</p>
    </div>
    <div class="meta-stats" id="seasonTotals">Loading index…</div>
  </header>

  <nav class="controls-bar">
    <div class="tabs">
      <button class="tab-btn active" data-view="slateView">Daily Slate</button>
      <button class="tab-btn" data-view="leaderboardView">Umpire Leaderboard</button>
    </div>

    <div class="filters" id="dateControls">
      <label for="dateSelect">Game Date</label>
      <select id="dateSelect"></select>
    </div>

    <div class="filters hidden" id="leaderControls">
      <label for="levelFilter">Level</label>
      <select id="levelFilter">
        <option value="ALL">All (AAA + FSL)</option>
        <option value="AAA">Triple-A</option>
        <option value="FSL">Florida State League</option>
      </select>
      <label for="minPitches">Min Pitches</label>
      <input type="number" id="minPitches" value="50" min="0" step="25" />
    </div>
  </nav>

  <main class="workspace">
    <!-- Daily Slate + Scorecard Split -->
    <section id="slateView" class="view-grid">
      <div class="slate-list" id="gamesList"></div>
      <aside class="scorecard-panel" id="scorecardPanel">
        <div class="empty-state">Select a game card to inspect its normalized Hawk-Eye strike zone and ABS overturns.</div>
      </aside>
    </section>

    <!-- Season Leaderboard -->
    <section id="leaderboardView" class="hidden">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Umpire</th>
              <th>Levels</th>
              <th>Games</th>
              <th>Taken</th>
              <th>Raw Acc%</th>
              <th>Tol Acc% (±0.20")</th>
              <th>Missed</th>
              <th>Mean Miss</th>
              <th>ABS Overturns</th>
              <th>Σ ΔRE24</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
